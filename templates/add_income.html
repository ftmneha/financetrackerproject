{% extends "base.html" %}

{% block content %}

<!-- ================= HERO ================= -->

<div class="hero fade-up mb-5">

    <div class="row align-items-center">

        <div class="col-lg-8">

            <h1 class="fw-bold">

                <i class="bi bi-cash-stack"></i>

                Add Income

            </h1>

            <p class="mt-3">

                Record a new income source and keep your financial records up to date.

            </p>

        </div>

        <div class="col-lg-4 text-end">

            <i class="bi bi-cash-coin"

               style="font-size:90px;color:#10B981;"></i>

        </div>

    </div>

</div>

<!-- ================= FORM ================= -->

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card zoom">

            <div class="card-body p-5">

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-wallet2"></i>

                            Income Source

                        </label>

                        <input
                            type="text"
                            name="source"
                            class="form-control"
                            placeholder="Example: Salary, Freelancing, Bonus"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-currency-rupee"></i>

                            Amount

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="amount"
                            class="form-control"
                            placeholder="Enter income amount"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-calendar-event"></i>

                            Date

                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            required>

                    </div>

                    <div class="d-grid gap-3">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            <i class="bi bi-plus-circle-fill"></i>

                            Save Income

                        </button>

                        <a href="{{ url_for('dashboard') }}"
                           class="btn btn-outline-secondary btn-lg">

                            <i class="bi bi-arrow-left-circle"></i>

                            Back to Dashboard

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
