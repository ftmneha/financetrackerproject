{% extends "base.html" %}

{% block content %}

<!-- ================= HERO ================= -->
<div class="hero fade-up mb-5">
    <div class="row align-items-center">
        <div class="col-lg-8">
            <h1 class="fw-bold">
                <i class="bi bi-dash-circle-fill text-danger me-2"></i>Add Expense
            </h1>
            <p class="mt-3 text-muted">
                Document your personal financial outlays and categorize expenditures.
            </p>
        </div>
        <div class="col-lg-4 text-end">
            <i class="bi bi-credit-card-2-front-fill" style="font-size:90px; color:#EF4444;"></i>
        </div>
    </div>
</div>

<!-- ================= FORM ================= -->
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card zoom shadow-sm border-0">
            <div class="card-body p-5">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-tags-fill text-danger me-1"></i> Expense Category
                        </label>
                        <input
                            type="text"
                            class="form-control form-control-lg"
                            name="category"
                            placeholder="e.g. Rent, Groceries, Utilities, Entertainment"
                            required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-currency-rupee text-danger me-1"></i> Amount
                        </label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control form-control-lg"
                            name="amount"
                            placeholder="Enter expense amount"
                            required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">
                            <i class="bi bi-calendar-event text-danger me-1"></i> Date
                        </label>
                        <input
                            type="date"
                            class="form-control form-control-lg"
                            name="date"
                            required>
                    </div>

                    <div class="d-grid gap-3 mt-4">
                        <button type="submit" class="btn btn-danger btn-lg shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Expense
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-arrow-left-circle me-1"></i> Back to Dashboard
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
