{% extends "base.html" %}

{% block content %}

<!-- ================= HERO ================= -->

<div class="hero fade-up mb-5">

    <div class="row align-items-center">

        <div class="col-lg-8">

            <h1 class="fw-bold">

                <i class="bi bi-piggy-bank-fill"></i>

                Monthly Budget

            </h1>

            <p class="mt-3">

                Set your monthly budget and keep your spending under control.

            </p>

        </div>

        <div class="col-lg-4 text-end">

            <i class="bi bi-wallet-fill"
               style="font-size:90px;color:#F59E0B;"></i>

        </div>

    </div>

</div>

<!-- ================= BUDGET FORM ================= -->

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card zoom">

            <div class="card-body p-5">

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-currency-rupee"></i>

                            Monthly Budget

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="amount"
                            placeholder="Enter your monthly budget"
                            value="{{ budget.amount if budget else '' }}"
                            required>

                    </div>

                    {% if budget %}

                    <div class="alert alert-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Current Budget:
                        <strong>₹ {{ budget.amount }}</strong>

                    </div>

                    {% endif %}

                    <div class="d-grid gap-3">

                        <button
                            type="submit"
                            class="btn btn-warning btn-lg">

                            <i class="bi bi-piggy-bank-fill"></i>

                            Save Budget

                        </button>

                        <a href="{{ url_for('dashboard') }}"
                           class="btn btn-outline-secondary btn-lg">

                            <i class="bi bi-arrow-left-circle"></i>

                            Back to Dashboard

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
