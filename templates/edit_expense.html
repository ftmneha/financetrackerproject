{% extends "base.html" %}

{% block content %}

<!-- ================= HERO ================= -->

<div class="hero fade-up mb-5">

    <div class="row align-items-center">

        <div class="col-lg-8">

            <h1 class="fw-bold">

                <i class="bi bi-pencil-square"></i>

                Edit Expense

            </h1>

            <p class="mt-3">

                Update your expense details and keep your financial records accurate.

            </p>

        </div>

        <div class="col-lg-4 text-end">

            <i class="bi bi-credit-card-2-front-fill"
               style="font-size:90px;color:#EF4444;"></i>

        </div>

    </div>

</div>

<!-- ================= FORM ================= -->

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card zoom">

            <div class="card-body p-5">

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-tags-fill"></i>

                            Expense Category

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="category"
                            value="{{ expense.category }}"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-currency-rupee"></i>

                            Amount

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="amount"
                            value="{{ expense.amount }}"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            <i class="bi bi-calendar-event"></i>

                            Date

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            name="date"
                            value="{{ expense.date }}"
                            required>

                    </div>

                    <div class="d-grid gap-3">

                        <button
                            type="submit"
                            class="btn btn-danger btn-lg">

                            <i class="bi bi-check-circle-fill"></i>

                            Update Expense

                        </button>

                        <a href="{{ url_for('transactions') }}"
                           class="btn btn-outline-secondary btn-lg">

                            <i class="bi bi-arrow-left-circle"></i>

                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
