{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center align-items-center">

    <div class="col-lg-6">

        <div class="auth-card zoom">

            <div class="text-center">

                <div class="icon-circle">

                    <i class="bi bi-person-plus-fill"></i>

                </div>

                <h2 class="mt-4 fw-bold">

                    Create Account

                </h2>

                <p class="text-muted">

                    Start your financial journey with FinTrack Pro.

                </p>

            </div>

            <form action="/register" method="POST" class="mt-4">

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        name="fullname"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Email Address

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100">

                    <i class="bi bi-person-check-fill"></i>

                    Create Account

                </button>

            </form>

            <hr class="my-4">

            <div class="text-center">

                Already have an account?

                <a href="/login" class="fw-bold text-success">

                    Login

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
