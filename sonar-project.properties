# SonarQube Configuration for Personal Finance Tracker
# INT378 - ADVANCEMENTS IN CLOUD AND DEVOPS

sonar.projectKey=personal-finance-tracker
sonar.projectName=Personal Finance Tracker (FinTrack Pro)
sonar.projectVersion=1.0.0

sonar.sources=.
sonar.tests=tests

# Language and encoding
sonar.sourceEncoding=UTF-8
sonar.language=py
sonar.python.version=3.12, 3.13

# Coverage configuration
sonar.python.coverage.reportPaths=reports/coverage.xml

# Exclusions
sonar.exclusions=tests/**,static/**,venv/**,.venv/**,instance/**,reports/**,monitoring/**,cloudformation/**,k8s/**
sonar.test.inclusions=tests/**
