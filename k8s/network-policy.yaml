apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fintrack-network-policy
  namespace: finance-tracker
  labels:
    app: finance-tracker
    security.policy: runtime-isolation
spec:
  podSelector:
    matchLabels:
      app: finance-tracker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress controller and internal cluster clients on port 8000
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTP/HTTPS for external APIs/packages if needed
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
