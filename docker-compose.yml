services:
  # =========================================================
  # 1. Flask Web Application (Personal Finance Tracker)
  # =========================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=
      - DATABASE_URL=sqlite:///instance/finance.db
    volumes:
      - fintrack-db-data:/app/instance
    networks:
      - fintrack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================
  # 2. Prometheus Monitoring Server
  # =========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fintrack-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - fintrack-network
    depends_on:
      web:
        condition: service_healthy

  # =========================================================
  # 3. Grafana Metrics Visualization
  # =========================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: fintrack-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - fintrack-network
    depends_on:
      - prometheus

networks:
  fintrack-network:
    driver: bridge

volumes:
  fintrack-db-data:
  prometheus-data:
  grafana-data:
